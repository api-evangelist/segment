  updated: '2026-05-04'
description: >-
  Twilio Segment is a customer data platform that collects, cleans, and routes customer data to
  hundreds of downstream tools for analytics, marketing, and data warehousing. Its surface spans
  event collection (the HTTP Tracking API with identify, track, page, screen, group and alias
  calls, plus a pixel endpoint for environments where JavaScript cannot run), a Public API for
  programmatic management of workspaces, sources, destinations, warehouses, tracking plans,
  functions and transformations, Unify for identity resolution, Engage for audiences, Protocols
  for tracking-plan governance, Reverse ETL for warehouse-to-tool syncs, and connections to 90+
  warehouses including BigQuery, Snowflake and Databricks. Segment was acquired by Twilio in a
  $3.2B all-stock deal completed in 2020 and now sits inside Twilio's platform; Twilio completed
  an operational review in March 2024 and retained the business despite activist-investor pressure
  to divest. The docs, pricing and legal pages have moved onto twilio.com, and the legacy Segment
  Analytics libraries for iOS and Android reached full sunset on 2026-03-31. The older Config API
  is deprecated — no new tokens have been issued since early 2024 — with the Public API as the
  recommended replacement. The Public API host is authenticated: api.segmentapis.com returns 401
  anonymously, and no OpenAPI is publicly fetchable (see x-evidence).
