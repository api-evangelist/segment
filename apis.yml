apis:
- aid: segment:pixel-tracking-api
  name: Segment Pixel Tracking API
  tags:
  - Analytics
  - Email
  - Pixel
  - Tracking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://api.segment.io
  humanURL: >-
    https://www.twilio.com/docs/segment/connections/sources/catalog/libraries/server/pixel-tracking-api
  properties:
  - url: >-
      https://www.twilio.com/docs/segment/connections/sources/catalog/libraries/server/pixel-tracking-api
    type: Documentation
  - url: openapi/segment-pixel-tracking-api-openapi.yml
    type: OpenAPI
  description: >-
    The Segment Pixel Tracking API provides a way to collect analytics data using image pixel requests,
    which is useful in environments where JavaScript cannot execute, such as email clients. It supports
    identify, track, page, screen, group, and alias calls through pixel endpoints under the api.segment.io
    domain. This API is particularly suited for tracking email opens, ad impressions, and other contexts
    where embedding a tracking pixel is the only viable data collection method.
